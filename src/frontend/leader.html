<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Leader Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>👑 Quản Lý Phiên Điểm Danh</h1>
    </header>

    <!-- Form Khởi Tạo Phiên Điểm Danh -->
    <section id="session-form-card" class="card">
      <h2>Tạo Phiên Điểm Danh Mới</h2>
      <div class="form-group">
        <label>Email Người Ra Lệnh (Leader)</label>
        <input type="email" id="leader-email" placeholder="email@gmail.com">
      </div>
      <div class="form-group">
        <label>Mã Nhóm / Lớp</label>
        <input type="text" id="group-id" placeholder="VD: LOP_10A1" style="text-transform: uppercase;">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Thời Gian Làm Bài/Đến (Phút)</label>
          <input type="number" id="deadline-min" value="15" min="1">
        </div>
        <div class="form-group">
          <label>Trễ Tối Đa (Phút)</label>
          <input type="number" id="max-late-min" value="30" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Bán Kính GPS Cho Phép (Mét)</label>
        <select id="gps-radius">
          <option value="20">20 mét (Trong phòng)</option>
          <option value="50" selected>50 mét (Mặc định)</option>
          <option value="100">100 mét (Hội trường lớn)</option>
          <option value="200">200 mét (Khuôn viên)</option>
        </select>
      </div>

      <!-- Tùy Chọn Google Sheet Riêng -->
      <div class="form-group">
        <label>Link Google Sheet Riêng (Tùy Chọn)</label>
        <input type="url" id="custom-sheet-url" placeholder="https://docs.google.com/spreadsheets/d/...">
        <small class="sub-text">Để trống nếu muốn lưu dữ liệu về Master Sheet chung.</small>
      </div>

      <button id="btn-start-session" class="btn primary">🚀 Khởi Tạo Phiên Điểm Danh</button>
    </section>

    <!-- Màn Hình Hiển Thị QR Code Xoay Vòng (Chỉ hiện khi đã Start) -->
    <section id="qr-display-card" class="card text-center hidden">
      <h2>Mã QR Điểm Danh</h2>
      <p id="session-info-text">Phiên: LOP_10A1 | Hạn chót: 11:00</p>
      
      <div id="qrcode-box" class="qrcode-container"></div>
      
      <div class="qr-timer-box">
        <span>Mã tự đổi sau: <strong id="qr-countdown">30</strong>s</span>
      </div>

      <div class="form-group" style="margin-top: 1.5rem;">
        <label>Mã Nhập Tay (Fallback):</label>
        <h1 id="qr-text-code" class="text-highlight">X7K2M9P4</h1>
      </div>

      <button id="btn-close-session" class="btn danger">🛑 Đóng Phiên Thủ Công</button>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
