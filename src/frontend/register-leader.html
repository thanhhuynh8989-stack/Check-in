<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Leader - Check-in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>👔 Đăng Ký Leader / Quản Lý</h1>
    </header>

    <div class="card">
      <h2>Thông Tin Đăng Ký</h2>
      <div class="form-group">
        <label>Họ và Tên</label>
        <input type="text" id="leader-name" placeholder="VD: Huỳnh Thành">
      </div>
      <div class="form-group">
        <label>Email Google</label>
        <input type="email" id="leader-email" placeholder="example@gmail.com">
      </div>

      <!-- Bổ sung Trường Mật Khẩu -->
      <div class="form-group">
        <label>Mật Khẩu (Tối thiểu 6 ký tự)</label>
        <input type="password" id="leader-pass" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Xác Nhận Mật Khẩu</label>
        <input type="password" id="leader-pass-confirm" placeholder="••••••••">
      </div>

      <!-- Bổ sung Nút Kiểm Tra Link Sheet -->
      <div class="form-group">
        <label>Link Google Sheet Riêng (Tùy chọn)</label>
        <div style="display: flex; gap: 8px;">
          <input type="url" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/...">
          <button type="button" id="btn-verify-sheet" class="btn secondary" style="width: auto; white-space: nowrap;">🔍 Kiểm tra</button>
        </div>
        <small id="sheet-verify-status" class="sub-text">Để trống nếu muốn sử dụng Master Sheet chung của hệ thống.</small>
      </div>

      <button id="btn-register-leader" class="btn primary" style="margin-top: 15px;">Gửi Yêu Cầu Đăng Ký</button>
      <div style="margin-top: 15px; text-align: center;">
        <a href="leader.html" style="color: var(--primary); text-decoration: none;">Đã có tài khoản? Đến trang Đăng Nhập →</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/sheet-verifier.js"></script>
  <script src="js/leader-auto-auth.js"></script>
  <script src="js/leader-auth.js"></script>
</body>
</html>
